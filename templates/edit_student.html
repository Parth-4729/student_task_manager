
<form action="/update_student/{{ student.student_id}}"  method="POST">
    <input 
    type="text"
    name="first_name"
    value="{{ student.first_Name}}"
    class="form-control"
    ><br>
    <input 
    type="text"
    name="last_name"
    value="{{ student.last_name}}"
    class="form-control"
    ><br>
    
    <input 
    type="text"
    name="email"
    value="{{ student.email}}"
    class="form-control"
    ><br>
    <input 
    type="text"
    name="mobile_number"
    value="{{ student.mobile_number}}"
    class="form-control"
    ><br>
    <input 
    type="text"
    name="course_name"
    value="{{ student.course_name}}"
    class="form-control"
    ><br>
    <button
        type="submit"
    >
        Update Student
    </button>

</form>

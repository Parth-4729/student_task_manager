{% extends 'layout.html' %}

{% block content %}
<h2>Mark students</h2>

    <form action="/save_attendance" method="POST">
        <label>Students</label>

        <select name="student_id" class="form control">
            {% for students in students %}

            <option value="{{ students.student_id }}">
                {{ students.first_name }} {{ students.last_name }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <lable>Status</lable>

        <select name="attendance_status">
            <option value="Present">
                Present
            </option>

            <option value="Absent">
                Absent
            </option>
        </select>

        <br><br>

        <button type="submit">
            Save Attendance
        </button>
    </form>


{% endblock %}
